name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client-build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          CI: true # warnings fail the build

  server-smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    # Uses the MONGO_URI repository secret (Settings -> Secrets and variables -> Actions).
    # Skipped on forks / PRs from forks where secrets are not available.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Start API and run smoke test
        working-directory: server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PORT: 5000
        run: |
          if [ -z "$MONGO_URI" ]; then echo "MONGO_URI secret not set; skipping"; exit 0; fi
          node server.js & echo $! > server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:5000/api/health && break; sleep 1; done
          npm run smoke
          kill $(cat server.pid)
